# Local profile: LocalStack DynamoDB + KRaft Kafka from docker-compose.yml.
# SES is simulated, so notifications are visible in the logs and in the notifications table:
#   awslocal dynamodb scan --table-name notifications
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

aws:
  region: us-east-1
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}

app:
  kafka:
    listener:
      concurrency: 1

logging:
  level:
    io.orderflow: DEBUG
