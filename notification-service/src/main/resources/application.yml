server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  main:
    banner-mode: "off"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: "io.orderflow.common.event.EventEnvelopeSerde$EnvelopeDeserializer"
        max.poll.records: 100
        max.poll.interval.ms: 300000
    # A producer is still configured: the shared error handler needs one to write to <topic>.DLT.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record
      observation-enabled: true

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-url: ${AWS_ENDPOINT_URL:}
  dynamodb:
    max-retries: 5
    api-call-timeout-ms: 3000

app:
  dynamodb:
    tables:
      notifications: ${NOTIFICATIONS_TABLE:notifications}
      processed-events: ${PROCESSED_EVENTS_TABLE:processed_events}
  idempotency:
    retention-days: 7
  notifications:
    fallback-recipient: ${NOTIFICATION_FALLBACK_RECIPIENT:orders@example.com}
  kafka:
    listener:
      concurrency: ${KAFKA_CONCURRENCY:2}
    retry:
      initial-interval-ms: 500
      multiplier: 2.0
      max-interval-ms: 10000
      max-retries: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    io.orderflow: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [corr=%X{correlationId:-none} order=%X{orderId:-none}] %logger{36} - %msg%n"
